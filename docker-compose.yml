services:
  api:
    container_name: etch-api
    build:
      context: backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/backend/app
      - ./backend/alembic:/backend/alembic
      - ./backend/.python-version:/backend/.python-version
      - ./backend/alembic.ini:/backend/alembic.ini
      - ./backend/pyproject.toml:/backend/pyproject.toml
      - ./backend/uv.lock:/backend/uv.lock
    restart: on-failure:10

  postgres:
    image: postgres:18.4
    container_name: etch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${db_name}
      POSTGRES_USER: ${db_user}
      POSTGRES_PASSWORD: ${db_password}
    volumes:
      - pgdata18:/var/lib/postgresql
    ports:
      - "${db_port}:${db_port}"

  frontend:
    container_name: etch-frontend
    build:
      context: frontend
      dockerfile: Dockerfile
    environment:
      VITE_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/frontend
      - /frontend/node_modules
    
  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: etch-cloudbeaver
    restart: unless-stopped
    ports:
      - "8978:8978"
    volumes:
      - cloudbeaver_data:/opt/cloudbeaver/workspace
    
  redis:
    image: redis:8.10.0-alpine
    container_name: etch-redis
    restart: unless-stopped

    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf

    ports: 
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
      - ./backend/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./backend/redis/users.acl:/usr/local/etc/redis/users.acl:ro
    
  redisinsight:
    image: redis/redisinsight:latest
    container_name: etch-redisinsight
    ports:
      - "5540:5540"
    volumes:
      - redisinsight:/data

volumes:
  pgdata18:
  cloudbeaver_data:
  redis_data:
  redisinsight: