global:
  scrape_interval: 15s

scrape_configs:
  - job_name: etch-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: [api:8000]
    # Creation timestamps and Python runtime metadata are not operational charts.
    # Keep HTTP counters/histograms and process CPU, memory and file-descriptor metrics.
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: '.*_created|python_.*'
        action: drop

  - job_name: node-exporter
    static_configs:
      - targets: [node-exporter:9100]
    # Store the metrics used by the server dashboard plus collector health.
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'node_cpu_seconds_total|node_memory_(MemTotal|MemAvailable|SwapTotal|SwapFree)_bytes|node_load(1|5|15)|node_filesystem_(size_bytes|avail_bytes|readonly|device_error)|node_disk_(read_bytes_total|written_bytes_total|reads_completed_total|writes_completed_total|io_time_seconds_total)|node_boot_time_seconds|node_scrape_collector_(success|duration_seconds)'
        action: keep
