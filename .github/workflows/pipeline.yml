name: etch pipeline

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    concurrency:
      group: ${{ github.workflow }}-frontend-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: prepare frontend configuration
        run: cp .env.example .env

      - name: setup node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: install dependencies
        run: npm ci

      - name: check formatting
        run: npm run format:check

      - name: check types
        run: npm run typecheck

      - name: check lint
        run: npm run lint

      - name: run tests
        run: npm run test

      - name: build frontend
        run: npm run build

  backend:
    name: backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    concurrency:
      group: ${{ github.workflow }}-backend-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true

    defaults:
      run:
        working-directory: backend

    steps:
      - name: checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: setup uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.21"
          python-version: "3.14"
          enable-cache: false

      - name: check ruff (app/common/utils.py)
        run: uvx --from ruff==0.15.4 ruff check --no-cache --output-format=github app/common/utils.py

      - name: prepare test configuration and JWT keys
        id: prepare
        run: |
          uv run --no-project python ../setup.py certs
          uv run --no-project python ../setup.py check test

      - name: build backend test image
        working-directory: .
        run: docker compose -f docker-compose-test.yml build api

      - name: start test services
        working-directory: .
        run: docker compose -f docker-compose-test.yml up -d --wait --wait-timeout 120 postgres redis

      - name: apply migrations
        working-directory: .
        run: docker compose -f docker-compose-test.yml run --rm -T --no-deps api uv run --no-sync alembic upgrade head

      - name: run tests
        working-directory: .
        run: docker compose -f docker-compose-test.yml run --rm -T --no-deps api uv run --no-sync pytest -o log_cli=false

      - name: show test services on failure
        if: ${{ failure() && steps.prepare.outcome == 'success' }}
        working-directory: .
        run: |
          docker compose -f docker-compose-test.yml ps -a
          docker compose -f docker-compose-test.yml logs --no-color --tail=200 postgres redis

      - name: clean up test services
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        working-directory: .
        run: docker compose -f docker-compose-test.yml down --volumes --remove-orphans

  publish:
    name: publish production images
    needs: [frontend, backend]
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    steps:
      - name: checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: prepare frontend build configuration
        working-directory: frontend
        run: cp .env.example .env

      - name: setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and publish backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}-backend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: build and publish frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}-frontend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: deploy production
    needs: publish
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    concurrency:
      group: etch-production-deploy
      cancel-in-progress: false

    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}

    steps:
      - name: prepare SSH authentication
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Missing DEPLOY_HOST}"
          : "${DEPLOY_USER:?Missing DEPLOY_USER}"
          : "${DEPLOY_SSH_KEY:?Missing DEPLOY_SSH_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?Missing DEPLOY_KNOWN_HOSTS}"
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/etch-deploy-key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/etch-known-hosts"
          ssh-keygen -y -P '' -f "$RUNNER_TEMP/etch-deploy-key" > /dev/null

      - name: update production server
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          ssh -T -p 22 \
            -i "$RUNNER_TEMP/etch-deploy-key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/etch-known-hosts" \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- '$GITHUB_SHA'" <<'DEPLOY'
          set -Eeuo pipefail
          umask 077
          export IMAGE_TAG="$1"
          export GIT_TERMINAL_PROMPT=0
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]
          cd /home/vaakesh/etch

          # Also serialize SSH sessions if a runner disconnects or is cancelled.
          exec 9> "$HOME/.etch-deploy.lock"
          flock -w 600 9

          if [[ "$(git branch --show-current)" != main ]]; then
            echo 'Deployment requires the main branch on the server.' >&2
            exit 1
          fi
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo 'Tracked files on the server have local changes.' >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if [[ "$(git rev-parse origin/main)" != "$IMAGE_TAG" ]]; then
            echo "Skipping outdated deployment: $IMAGE_TAG is no longer the main branch tip."
            exit 0
          fi
          git merge-base --is-ancestor HEAD "$IMAGE_TAG"
          # Tracked bind-mounted configs must be readable by container users.
          umask 022
          git merge --ff-only "$IMAGE_TAG"
          umask 077
          [[ "$(git rev-parse HEAD)" == "$IMAGE_TAG" ]]

          command -v make > /dev/null
          make prod-deploy
          DEPLOY
