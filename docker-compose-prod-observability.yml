# Same log cap as docker-compose-prod.yml; YAML anchors are not shared between files.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  api:
    environment:
      PROMETHEUS_DISABLE_CREATED_SERIES: "true"
      OTEL_SERVICE_NAME: etch-api
      OTEL_RESOURCE_ATTRIBUTES: "deployment.environment.name=production,service.version=${IMAGE_TAG:?IMAGE_TAG is required}"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://otel-collector:4318/v1/logs
    stop_grace_period: 30s

  celery-worker:
    environment:
      OTEL_SERVICE_NAME: etch-worker
      OTEL_RESOURCE_ATTRIBUTES: "deployment.environment.name=production,service.version=${IMAGE_TAG:?IMAGE_TAG is required}"
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://otel-collector:4318/v1/logs
    depends_on:
      redis:
        condition: service_healthy
    stop_grace_period: 120s

  celery-beat:
    environment:
      OTEL_SERVICE_NAME: etch-beat
      OTEL_RESOURCE_ATTRIBUTES: "deployment.environment.name=production,service.version=${IMAGE_TAG:?IMAGE_TAG is required}"
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://otel-collector:4318/v1/logs
    stop_grace_period: 30s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    logging: *default-logging
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector-prod.yaml:/etc/otelcol/config.yaml:ro
    mem_limit: 256m
    stop_grace_period: 30s
    restart: unless-stopped

  tempo:
    image: grafana/tempo:3.1.0
    logging: *default-logging
    mem_limit: 384m
    command:
      - "-target=all"
      - "-config.file=/etc/tempo.yaml"
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    stop_grace_period: 60s
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.0
    logging: *default-logging
    command:
      - "-config.file=/etc/loki/config.yaml"
    volumes:
      - ./observability/loki.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    ports:
      - "127.0.0.1:${loki_port}:3100"
    stop_grace_period: 30s
    restart: unless-stopped

  # Read host CPU, memory and disks; expose metrics only inside the Compose network.
  node-exporter:
    image: prom/node-exporter:v1.12.1
    logging: *default-logging
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --web.disable-exporter-metrics
      - --collector.disable-defaults
      - --collector.cpu
      - --collector.meminfo
      - --collector.loadavg
      - --collector.filesystem
      - --collector.diskstats
      - --collector.stat
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker|var/lib/containers)($$|/)
    pid: host
    volumes:
      - /:/host:ro,rslave
    read_only: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.0
    logging: *default-logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/metrics_token:/run/secrets/metrics_token:ro
      - prometheus_data:/prometheus
    stop_grace_period: 30s
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    logging: *default-logging
    mem_limit: 512m
    ports:
      - "127.0.0.1:${grafana_port}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${grafana_admin_user}
      GF_SECURITY_ADMIN_PASSWORD: ${grafana_admin_password}
      GF_USERS_ALLOW_SIGN_UP: "${grafana_allow_sign_up}"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
      - tempo
    stop_grace_period: 30s
    restart: unless-stopped

  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    logging: *default-logging
    mem_limit: 512m
    ports:
      - "127.0.0.1:${cloudbeaver_port}:8978"
    volumes:
      - cloudbeaver_data:/opt/cloudbeaver/workspace
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  redisinsight:
    image: redis/redisinsight:latest
    logging: *default-logging
    mem_limit: 256m
    ports:
      - "127.0.0.1:${redisinsight_port}:5540"
    volumes:
      - redisinsight:/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  tempo_data:
  loki_data:
  prometheus_data:
  grafana_data:
  cloudbeaver_data:
  redisinsight:
