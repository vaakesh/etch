name: etch-observability

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    command: ["--config=/etc/otelcol/config.yaml"]
    networks:
      - observability
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - loki
      - tempo
    mem_limit: 256m
    stop_grace_period: 30s
    restart: unless-stopped

  tempo:
    image: grafana/tempo:3.1.0
    command:
      - "-target=all"
      - "-config.file=/etc/tempo.yaml"
    networks:
      - observability
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "127.0.0.1:${tempo_port}:3200"
    stop_grace_period: 60s
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.0
    command:
      - "-config.file=/etc/loki/config.yaml"
    networks:
      - observability
    volumes:
      - ./observability/loki.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    ports:
      - "127.0.0.1:${loki_port}:3100"
    stop_grace_period: 30s
    restart: unless-stopped

  # Read host CPU, memory and disks; expose metrics only inside the observability network.
  node-exporter:
    image: prom/node-exporter:v1.12.1
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --web.disable-exporter-metrics
      - --collector.disable-defaults
      - --collector.cpu
      - --collector.meminfo
      - --collector.loadavg
      - --collector.filesystem
      - --collector.diskstats
      - --collector.stat
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker|var/lib/containers)($$|/)
    pid: host
    networks:
      - observability
    volumes:
      - /:/host:ro
    read_only: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.1
    restart: unless-stopped
    networks:
      - observability
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/metrics_token:/run/secrets/metrics_token:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=3d

  grafana:
    image: grafana/grafana:13.2.4
    restart: unless-stopped
    networks:
      - observability
    ports:
      - "127.0.0.1:${grafana_port}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${grafana_admin_user}
      GF_SECURITY_ADMIN_PASSWORD: ${grafana_admin_password}
      GF_USERS_ALLOW_SIGN_UP: "${grafana_allow_sign_up}"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
      - tempo

networks:
  # Created by make, like the shared network on the server.
  observability:
    name: observability
    external: true

volumes:
  tempo_data:
  loki_data:
  prometheus_data:
  grafana_data:
