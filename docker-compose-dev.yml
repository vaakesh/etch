name: etch-dev
services:
  api:
    build:
      context: backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      PROMETHEUS_DISABLE_CREATED_SERIES: "true"
    ports:
      - "127.0.0.1:${api_port}:8000"
    volumes:
      - ./backend/alembic:/backend/alembic
      - ./backend/app:/backend/app
      - ./backend/certs:/backend/certs:ro
      - ./backend/.python-version:/backend/.python-version
      - ./backend/alembic.ini:/backend/alembic.ini
      - ./backend/pyproject.toml:/backend/pyproject.toml
      - ./backend/uv.lock:/backend/uv.lock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - uv
        - run
        - --no-sync
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5).close()"
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    restart: on-failure:10

  celery-worker:
    build:
      context: backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    command:
      - uv
      - run
      - --no-sync
      - celery
      - -A
      - app.celery.celery_app:celery_app
      - worker
      - --pool=prefork
      - --concurrency=1
      - --loglevel=INFO
    volumes:
      - ./backend/app:/backend/app:ro
      - ./backend/certs:/backend/certs:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    stop_grace_period: 60s
    restart: unless-stopped

  celery-beat:
    build:
      context: backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    command:
      - uv
      - run
      - --no-sync
      - celery
      - -A
      - app.celery.celery_app:celery_app
      - beat
      - --loglevel=INFO
      - --schedule=/var/lib/celery/celerybeat-schedule
    volumes:
      - ./backend/app:/backend/app:ro
      - ./backend/certs:/backend/certs:ro
      - celery_beat_data:/var/lib/celery
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${rabbitmq_user}
      RABBITMQ_DEFAULT_PASS: ${rabbitmq_password}
    ports:
      - "127.0.0.1:${rabbitmq_port}:5672"
      - "127.0.0.1:${rabbitmq_management_port}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # Read host CPU, memory and disks; expose metrics only inside the Compose network.
  node-exporter:
    image: prom/node-exporter:v1.12.1
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --web.disable-exporter-metrics
      - --collector.disable-defaults
      - --collector.cpu
      - --collector.meminfo
      - --collector.loadavg
      - --collector.filesystem
      - --collector.diskstats
      - --collector.stat
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker|var/lib/containers)($$|/)
    pid: host
    volumes:
      - /:/host:ro
    read_only: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/metrics_token:/run/secrets/metrics_token:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=3d

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${grafana_port}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${grafana_admin_user}
      GF_SECURITY_ADMIN_PASSWORD: ${grafana_admin_password}
      GF_USERS_ALLOW_SIGN_UP: "${grafana_allow_sign_up}"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus

  postgres:
    image: postgres:18.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${db_name}
      POSTGRES_USER: ${db_user}
      POSTGRES_PASSWORD: ${db_password}
    volumes:
      - pgdata18:/var/lib/postgresql
    ports:
      - "${db_port}:5432"
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    env_file:
      - ./frontend/.env
    ports:
      - "${frontend_port}:5173"
    volumes:
      - ./frontend/public:/frontend/public
      - ./frontend/src:/frontend/src
      - ./frontend/.prettierignore:/frontend/.prettierignore
      - ./frontend/eslint.config.js:/frontend/eslint.config.js
      - ./frontend/index.html:/frontend/index.html
      - ./frontend/package-lock.json:/frontend/package-lock.json
      - ./frontend/package.json:/frontend/package.json
      - ./frontend/prettier.config.mjs:/frontend/prettier.config.mjs
      - ./frontend/tsconfig.app.json:/frontend/tsconfig.app.json
      - ./frontend/tsconfig.json:/frontend/tsconfig.json
      - ./frontend/tsconfig.node.json:/frontend/tsconfig.node.json
      - ./frontend/vite.config.ts:/frontend/vite.config.ts
      - ./frontend/vitest.config.ts:/frontend/vitest.config.ts
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:5173/"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    
  redis:
    image: redis:8.10.0-alpine
    restart: unless-stopped

    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf

    ports: 
      - "127.0.0.1:${redis_port}:6379"
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./redis/users.acl:/usr/local/etc/redis/users.acl:ro
    healthcheck:
      # NOAUTH also confirms Redis is ready when anonymous access is disabled.
      test: ["CMD-SHELL", "redis-cli ping | grep -qE '^(PONG|NOAUTH)'"]
      interval: 10s
      timeout: 5s
      retries: 5
    
volumes:
  prometheus_data:
  grafana_data:
  pgdata18:
  redis_data:
  rabbitmq_data:
  celery_beat_data:
