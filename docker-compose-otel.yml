services:
  api:
    environment:
      OTEL_SERVICE_NAME: etch-api
      OTEL_RESOURCE_ATTRIBUTES: "deployment.environment.name=development,service.version=0.1.0"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://otel-collector:4318/v1/logs
    stop_grace_period: 30s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    mem_limit: 256m
    stop_grace_period: 30s
    restart: unless-stopped

  tempo:
    image: grafana/tempo:3.1.0
    command:
      - "-target=all"
      - "-config.file=/etc/tempo.yaml"
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "127.0.0.1:${tempo_port}:3200"
    stop_grace_period: 60s
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.0
    command:
      - "-config.file=/etc/loki/config.yaml"

    volumes:
      - ./observability/loki.yaml:/etc/loki/config.yaml:ro

      - loki_data:/loki

    ports:
      - "127.0.0.1:${loki_port}:3100"

    stop_grace_period: 30s
    restart: unless-stopped

  celery-worker:
    environment:
      OTEL_SERVICE_NAME: etch-worker
      OTEL_RESOURCE_ATTRIBUTES: "deployment.environment.name=development,service.version=0.1.0"
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://otel-collector:4318/v1/logs

  celery-beat:
    environment:
      OTEL_SERVICE_NAME: etch-beat
      OTEL_RESOURCE_ATTRIBUTES: "deployment.environment.name=development,service.version=0.1.0"
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://otel-collector:4318/v1/logs
    stop_grace_period: 30s

  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    restart: unless-stopped
    ports:
      - "${cloudbeaver_port}:8978"
    volumes:
      - cloudbeaver_data:/opt/cloudbeaver/workspace
    depends_on:
      postgres:
        condition: service_healthy

  redisinsight:
    image: redis/redisinsight:latest
    ports:
      - "${redisinsight_port}:5540"
    volumes:
      - redisinsight:/data
    depends_on:
      redis:
        condition: service_healthy

volumes:
  tempo_data:
  loki_data:
  cloudbeaver_data:
  redisinsight:
