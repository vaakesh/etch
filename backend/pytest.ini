[pytest]
testpaths =
    tests
    tests_beta
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-config
    --strict-markers
    --import-mode=importlib
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
markers =
    integration: tests that use PostgreSQL or multiple application layers
log_cli = true
log_cli_level = DEBUG