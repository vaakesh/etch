[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.5",
    "altcha>=2.3.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "celery>=5.6.3",
    "fastapi[standard]>=0.138.2",
    "httpx>=0.28.1",
    "opentelemetry-api>=1.45.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
    "opentelemetry-instrumentation-asyncpg==0.66b0",
    "opentelemetry-instrumentation-fastapi>=0.66b0",
    "opentelemetry-instrumentation-logging==0.66b0",
    "opentelemetry-instrumentation-redis==0.66b0",
    "opentelemetry-instrumentation-sqlalchemy==0.66b0",
    "opentelemetry-sdk>=1.45.0",
    "orjson>=3.11.9",
    "prometheus-client>=0.26.0",
    "pyjwt[crypto]>=2.13.0",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
    "ty>=0.0.99",
]

[tool.ruff]
target-version = "py314"
line-length = 92

[tool.ruff.lint]
extend-select = [
    "UP", # pyupgrade
    "I", # isort
    "E501", # line too long
]
ignore = [
    "TRY004", # parsing malformed payloads raises ValueError, callers catch it
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "app.decks.schemas.DeckLoad", # frozen dataclass
]

[tool.ruff.lint.per-file-ignores]
# applied migrations keep raw SQL as it was executed
"alembic/versions/*" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
