<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta id="theme-color" name="theme-color" content="#0f1116" />
    <script>
      const usesLightBootPalette =
        window.location.pathname === "/" ||
        window.location.pathname === "/library" ||
        window.location.pathname.startsWith("/library/") ||
        window.location.pathname === "/practice";

      document.documentElement.dataset.bootPalette = usesLightBootPalette ? "light" : "dark";
      if (usesLightBootPalette) {
        document.getElementById("theme-color")?.setAttribute("content", "#f6f2eb");
      }
    </script>
    <style>
      :root {
        --loader-background: #0f1116;
        --loader-track: rgb(242 233 218 / 14%);
        --loader-accent: #2a6f6b;
      }

      :root[data-boot-palette="light"] {
        --loader-background: #f6f2eb;
        --loader-track: #e7dfd4;
        --loader-accent: #4d9892;
      }

      html,
      body,
      #root {
        min-height: 100%;
      }

      #root[data-booting] {
        visibility: hidden;
      }

      body {
        margin: 0;
        background: var(--loader-background);
      }

      #boot-loader {
        display: grid;
        min-height: 100vh;
        min-height: 100dvh;
        place-items: center;
        background: var(--loader-background);
      }

      #boot-loader {
        position: fixed;
        z-index: 1;
        inset: 0;
      }

      #boot-loader .page-loader__spinner {
        box-sizing: border-box;
        width: 32px;
        height: 32px;
        border: 3px solid var(--loader-track);
        border-top-color: var(--loader-accent);
        border-radius: 50%;
        animation: page-loader-spin 700ms linear infinite;
      }

      @keyframes page-loader-spin {
        to {
          transform: rotate(1turn);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot-loader .page-loader__spinner {
          animation: none;
        }
      }
    </style>
    <meta
      name="description"
      content="Etch — спокойное пространство для изучения и запоминания слов."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Playfair+Display:wght@500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <title>Вход — Etch</title>
  </head>
  <body>
    <div aria-label="Загрузка страницы" class="page-loader" id="boot-loader" role="status">
      <span aria-hidden="true" class="page-loader__spinner"></span>
    </div>
    <div aria-hidden="true" data-booting id="root" inert></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
