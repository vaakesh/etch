<!doctype html>
<html lang="ru-RU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta
      id="meta-description"
      name="description"
      content="Etch — спокойное пространство для изучения и запоминания слов."
    />
    <meta id="theme-color" name="theme-color" content="#c3b8f5" />
    <script>
      const storedLocale = (() => {
        try {
          return window.localStorage.getItem("etch.locale");
        } catch {
          return null;
        }
      })();
      const selectedLocale = ["ru-RU", "en-US"].includes(storedLocale) ? storedLocale : "ru-RU";
      const storedTheme = (() => {
        try {
          return window.localStorage.getItem("etch.theme");
        } catch {
          return null;
        }
      })();
      const selectedTheme = ["light", "dark", "system"].includes(storedTheme)
        ? storedTheme
        : "light";
      const resolvedTheme =
        selectedTheme === "system"
          ? window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light"
          : selectedTheme;
      const usesLightBootPalette =
        window.location.pathname === "/" ||
        window.location.pathname === "/library" ||
        window.location.pathname.startsWith("/library/") ||
        window.location.pathname === "/practice" ||
        window.location.pathname === "/settings";

      document.documentElement.lang = selectedLocale;
      document.documentElement.dataset.theme = resolvedTheme;
      document.documentElement.dataset.bootPalette = usesLightBootPalette ? "light" : "dark";
      document.documentElement.style.colorScheme = resolvedTheme;
      if (resolvedTheme === "dark") {
        document.getElementById("theme-color")?.setAttribute("content", "#171a18");
      } else if (usesLightBootPalette) {
        document.getElementById("theme-color")?.setAttribute("content", "#f6f2eb");
      }
      if (selectedLocale === "en-US") {
        document
          .getElementById("meta-description")
          ?.setAttribute("content", "Etch — a calm space for learning and remembering vocabulary.");
      }
    </script>
    <style>
      :root {
        --app-background: linear-gradient(105deg, #c3b8f5 0%, #9be8e0 48%, #f5c6e8 100%);
        --loader-background: linear-gradient(105deg, #c3b8f5 0%, #9be8e0 48%, #f5c6e8 100%);
        --loader-track: rgb(73 56 115 / 14%);
        --loader-accent: #493873;
      }

      :root[data-boot-palette="light"] {
        --loader-background: #f6f2eb;
        --loader-track: #e7dfd4;
        --loader-accent: #4d9892;
      }

      :root[data-theme="dark"] {
        --app-background: #171a18;
        --loader-background: #171a18;
        --loader-track: rgb(159 186 174 / 12%);
        --loader-accent: #9fbaae;
      }

      html,
      body,
      #root {
        min-height: 100%;
        background: var(--app-background);
      }

      body,
      #root {
        min-height: 100vh;
        min-height: 100dvh;
      }

      #root[data-booting] {
        visibility: hidden;
      }

      body {
        margin: 0;
        background: var(--app-background);
      }

      #boot-loader {
        display: grid;
        min-height: 100vh;
        min-height: 100dvh;
        place-items: center;
        background: var(--loader-background);
      }

      #boot-loader {
        position: fixed;
        z-index: 1;
        inset: 0;
      }

      #boot-loader .page-loader__spinner {
        box-sizing: border-box;
        width: 32px;
        height: 32px;
        border: 3px solid var(--loader-track);
        border-top-color: var(--loader-accent);
        border-radius: 50%;
        animation: page-loader-spin 700ms linear infinite;
      }

      @keyframes page-loader-spin {
        to {
          transform: rotate(1turn);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot-loader .page-loader__spinner {
          animation: none;
        }
      }
    </style>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Etch</title>
  </head>
  <body>
    <div aria-label="Загрузка страницы" class="page-loader" id="boot-loader" role="status">
      <span aria-hidden="true" class="page-loader__spinner"></span>
    </div>
    <script>
      if (document.documentElement.lang === "en-US") {
        document.getElementById("boot-loader")?.setAttribute("aria-label", "Loading page");
      }
    </script>
    <div aria-hidden="true" data-booting id="root" inert></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
