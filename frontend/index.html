<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1116" />
    <style>
      html,
      body,
      #root {
        min-height: 100%;
      }

      #root[data-booting] {
        visibility: hidden;
      }

      body {
        margin: 0;
        background: #0f1116;
      }

      .page-loader {
        display: grid;
        min-height: 100vh;
        min-height: 100dvh;
        place-items: center;
        background: #0f1116;
      }

      #boot-loader {
        position: fixed;
        z-index: 1;
        inset: 0;
      }

      .page-loader__spinner {
        box-sizing: border-box;
        width: 32px;
        height: 32px;
        border: 3px solid rgb(242 233 218 / 14%);
        border-top-color: #2a6f6b;
        border-radius: 50%;
        animation: page-loader-spin 700ms linear infinite;
      }

      @keyframes page-loader-spin {
        to {
          transform: rotate(1turn);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .page-loader__spinner {
          animation: none;
        }
      }
    </style>
    <meta
      name="description"
      content="Verba — спокойное пространство для изучения и запоминания слов."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Playfair+Display:wght@500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <title>Вход — Verba</title>
  </head>
  <body>
    <div aria-label="Загрузка страницы" class="page-loader" id="boot-loader" role="status">
      <span aria-hidden="true" class="page-loader__spinner"></span>
    </div>
    <div aria-hidden="true" data-booting id="root" inert></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
