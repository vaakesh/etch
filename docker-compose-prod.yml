name: etch-prod

# Cap container logs so json-file output cannot fill the disk between deployments.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  api:
    image: ghcr.io/vaakesh/etch-backend:${IMAGE_TAG}
    logging: *default-logging
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/certs:/backend/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - uv
        - run
        - --no-sync
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5).close()"
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  celery-worker:
    image: ghcr.io/vaakesh/etch-backend:${IMAGE_TAG}
    logging: *default-logging
    env_file:
      - ./backend/.env
    command:
      - uv
      - run
      - --no-sync
      - celery
      - -A
      - app.celery.celery_app:celery_app
      - worker
      - --pool=prefork
      - --concurrency=1
      - --loglevel=INFO
    volumes:
      - ./backend/certs:/backend/certs:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    stop_grace_period: 60s
    restart: unless-stopped

  celery-beat:
    image: ghcr.io/vaakesh/etch-backend:${IMAGE_TAG}
    logging: *default-logging
    env_file:
      - ./backend/.env
    command:
      - uv
      - run
      - --no-sync
      - celery
      - -A
      - app.celery.celery_app:celery_app
      - beat
      - --loglevel=INFO
      - --schedule=/var/lib/celery/celerybeat-schedule
    volumes:
      - ./backend/certs:/backend/certs:ro
      - celery_beat_data:/var/lib/celery
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management
    logging: *default-logging
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${rabbitmq_user}
      RABBITMQ_DEFAULT_PASS: ${rabbitmq_password}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:18.4
    logging: *default-logging
    environment:
      POSTGRES_DB: ${db_name}
      POSTGRES_USER: ${db_user}
      POSTGRES_PASSWORD: ${db_password}
    volumes:
      - pgdata18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  caddy:
    image: ghcr.io/vaakesh/etch-frontend:${IMAGE_TAG}
    logging: *default-logging
    environment:
      SITE_DOMAIN: ${site_domain_prod}
      ALLOWED_IP_PROD: ${allowed_ip_prod:?Set allowed_ip_prod in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_config:/config
      - caddy_data:/data
      - ./frontend/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/index.html"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  redis:
    image: redis:8.10.0-alpine
    logging: *default-logging
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./redis/users.acl:/usr/local/etc/redis/users.acl:ro
    healthcheck:
      # NOAUTH also confirms Redis is ready when anonymous access is disabled.
      test: ["CMD-SHELL", "redis-cli ping | grep -qE '^(PONG|NOAUTH)'"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  caddy_config:
  caddy_data:
  pgdata18:
  redis_data:
  rabbitmq_data:
  celery_beat_data:
