name: etch-prod

services:
  api:
    image: ghcr.io/vaakesh/etch-backend:${IMAGE_TAG:?IMAGE_TAG is required}
    env_file:
      - ./backend/.env
    environment:
      celery_broker_url: "amqp://${rabbitmq_user:?rabbitmq_user is required}:${rabbitmq_password:?rabbitmq_password is required}@rabbitmq:5672//"
    volumes:
      - type: bind
        source: ./backend/certs
        target: /backend/certs
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - uv
        - run
        - --no-sync
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5).close()"
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  celery-worker:
    image: ghcr.io/vaakesh/etch-backend:${IMAGE_TAG:?IMAGE_TAG is required}
    env_file:
      - ./backend/.env
    environment:
      db_host: postgres
      db_port: "5432"
      celery_broker_url: "amqp://${rabbitmq_user:?rabbitmq_user is required}:${rabbitmq_password:?rabbitmq_password is required}@rabbitmq:5672//"
    command:
      - uv
      - run
      - --no-sync
      - celery
      - -A
      - app.celery.celery_app:celery_app
      - worker
      - --pool=prefork
      - --concurrency=1
      - --loglevel=INFO
    volumes:
      - type: bind
        source: ./backend/certs
        target: /backend/certs
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    stop_grace_period: 60s
    restart: unless-stopped

  celery-beat:
    image: ghcr.io/vaakesh/etch-backend:${IMAGE_TAG:?IMAGE_TAG is required}
    env_file:
      - ./backend/.env
    environment:
      db_host: postgres
      db_port: "5432"
      celery_broker_url: "amqp://${rabbitmq_user:?rabbitmq_user is required}:${rabbitmq_password:?rabbitmq_password is required}@rabbitmq:5672//"
    command:
      - uv
      - run
      - --no-sync
      - celery
      - -A
      - app.celery.celery_app:celery_app
      - beat
      - --loglevel=INFO
      - --schedule=/var/lib/celery/celerybeat-schedule
    volumes:
      - type: bind
        source: ./backend/certs
        target: /backend/certs
        read_only: true
        bind:
          create_host_path: false
      - celery_beat_data:/var/lib/celery
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${rabbitmq_user:?rabbitmq_user is required}
      RABBITMQ_DEFAULT_PASS: ${rabbitmq_password:?rabbitmq_password is required}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_DB: ${db_name}
      POSTGRES_USER: ${db_user}
      POSTGRES_PASSWORD: ${db_password}
    volumes:
      - pgdata18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  caddy:
    image: ghcr.io/vaakesh/etch-frontend:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      SITE_DOMAIN: ${site_domain_prod}
      ALLOWED_IP: ${allowed_ip_prod}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_config:/config
      - caddy_data:/data
      - type: bind
        source: ./frontend/Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/index.html"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  redis:
    image: redis:8.10.0-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - redis_data:/data
      - type: bind
        source: ./redis/redis.conf
        target: /usr/local/etc/redis/redis.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./redis/users.acl
        target: /usr/local/etc/redis/users.acl
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      # NOAUTH also confirms Redis is ready when anonymous access is disabled.
      test: ["CMD-SHELL", "redis-cli ping | grep -qE '^(PONG|NOAUTH)'"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  caddy_config:
  caddy_data:
  pgdata18:
  redis_data:
  rabbitmq_data:
  celery_beat_data:
