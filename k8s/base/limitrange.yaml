# значения для контейнеров, у которых в манифесте не указаны resources; у всех текущих
# они заданы явно, это страховка, чтобы новый под не остался без лимита памяти
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      default:
        memory: 256Mi
