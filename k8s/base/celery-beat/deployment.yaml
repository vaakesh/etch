apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
  labels:
    app.kubernetes.io/name: celery-beat
spec:
  # никогда не два beat: два экземпляра отправляли бы каждую задачу по расписанию дважды
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: celery-beat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: celery-beat
    spec:
      enableServiceLinks: false
      priorityClassName: etch-app
      containers:
        - name: celery-beat
          image: ghcr.io/vaakesh/etch-backend
          imagePullPolicy: IfNotPresent
          command:
            - uv
            - run
            - --no-sync
            - celery
            - -A
            - app.celery.celery_app:celery_app
            - beat
            - --loglevel=INFO
            - --schedule=/var/lib/celery/celerybeat-schedule
          envFrom:
            - secretRef:
                name: etch-backend-env
          volumeMounts:
            - name: schedule
              mountPath: /var/lib/celery
          resources:
            requests:
              cpu: 20m
              memory: 96Mi
            limits:
              memory: 192Mi
      volumes:
        - name: schedule
          emptyDir: {}
