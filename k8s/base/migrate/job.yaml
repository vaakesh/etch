apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  labels:
    app.kubernetes.io/name: migrate
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrate
    spec:
      enableServiceLinks: false
      priorityClassName: etch-app
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/vaakesh/etch-backend
          imagePullPolicy: IfNotPresent
          command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
          envFrom:
            - secretRef:
                name: etch-backend-env
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 384Mi
