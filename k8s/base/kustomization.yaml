apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: etch

resources:
  - namespace.yaml
  - priorityclasses.yaml
  - limitrange.yaml
  - postgres/statefulset.yaml
  - postgres/service.yaml
  - redis/statefulset.yaml
  - redis/service.yaml
  - rabbitmq/statefulset.yaml
  - rabbitmq/service.yaml
  - api/deployment.yaml
  - api/service.yaml
  - api/hpa.yaml
  - api/pdb.yaml
  - celery-worker/deployment.yaml
  - celery-beat/deployment.yaml
  - frontend/deployment.yaml
  - frontend/service.yaml
  - gateway/gateway.yaml
  - gateway/middleware.yaml
  - gateway/httproutes.yaml

configMapGenerator:
  # тот же файл, что у docker compose; лежит вне k8s/, поэтому deploy.sh рендерит
  # манифесты с --load-restrictor LoadRestrictionsNone
  - name: redis-config
    files:
      - ../../redis/redis.conf
  - name: frontend-caddyfile
    files:
      - Caddyfile=frontend/Caddyfile.k8s
