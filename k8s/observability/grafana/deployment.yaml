apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
    spec:
      enableServiceLinks: false
      # образ работает под uid 472
      securityContext:
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:13.2.3
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: etch-root-env
                  key: grafana_admin_user
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: etch-root-env
                  key: grafana_admin_password
            - name: GF_USERS_ALLOW_SIGN_UP
              valueFrom:
                secretKeyRef:
                  name: etch-root-env
                  key: grafana_allow_sign_up
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: /etc/grafana/dashboards/etch-kubernetes.json
            # на уровне info grafana пишет несколько строк на каждый запрос к источнику данных
            - name: GF_LOG_LEVEL
              value: warn
            # заставляет рантайм go собирать мусор до того, как достигнут лимит контейнера
            - name: GOMEMLIMIT
              value: 800MiB
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: dashboard-providers
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: dashboards
              mountPath: /etc/grafana/dashboards
              readOnly: true
            # источники данных и дашборды загружаются из файлов, поэтому постоянный том не нужен
            - name: data
              mountPath: /var/lib/grafana
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            # grafana 13 запускает плагины источников данных и приложений отдельными процессами; при 512Mi ее убивает oom
            limits:
              memory: 1Gi
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-providers
          configMap:
            name: grafana-dashboard-providers
        - name: dashboards
          configMap:
            name: grafana-dashboards
        - name: data
          emptyDir: {}
