global:
  scrape_interval: 15s

# те же задания и фильтры метрик, что в prometheus/prometheus.yml; цели находятся
# через api kubernetes, чтобы опрашивался каждый под, а не случайный за service
scrape_configs:
  - job_name: etch-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [etch]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        regex: api
        action: keep
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        regex: http
        action: keep
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: instance
    # время создания метрик и метаданные рантайма python для рабочих графиков не нужны
    # остаются http-счетчики и гистограммы, а также cpu, память и файловые дескрипторы процесса
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: '.*_created|python_.*'
        action: drop

  # cpu и память каждого контейнера, читаются с kubelet каждой ноды через api-сервер
  - job_name: kubelet-cadvisor
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    authorization:
      type: Bearer
      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        target_label: __metrics_path__
        replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
      - source_labels: [__meta_kubernetes_node_name]
        target_label: instance
    # остаются две метрики, только namespace приложения и только настоящие контейнеры (без записей уровня пода и pause)
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'container_cpu_usage_seconds_total|container_memory_working_set_bytes'
        action: keep
      - source_labels: [namespace]
        regex: etch
        action: keep
      - source_labels: [container]
        regex: '.+'
        action: keep
      - regex: 'id|name|image'
        action: labeldrop

  - job_name: node-exporter
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [etch]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        regex: node-exporter
        action: keep
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        regex: metrics
        action: keep
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: instance
    # хранятся метрики, которые использует дашборд сервера, и состояние коллекторов
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'node_cpu_seconds_total|node_memory_(MemTotal|MemAvailable|SwapTotal|SwapFree)_bytes|node_load(1|5|15)|node_filesystem_(size_bytes|avail_bytes|readonly|device_error)|node_disk_(read_bytes_total|written_bytes_total|reads_completed_total|writes_completed_total|io_time_seconds_total)|node_boot_time_seconds|node_scrape_collector_(success|duration_seconds)'
        action: keep
